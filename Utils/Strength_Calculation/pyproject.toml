[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sky3d-response"
version = "1.0.0"
description = "Reproducible linear-response analysis for Sky3D time signals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.6",
  "h5py>=3.8",
]

[project.scripts]
sky3d-response = "sky3d_response.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sky3d_response*"]
